name: Deploy to Modal

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    name: Deploy Web Service to Modal
    runs-on: ubuntu-latest

    permissions:
      actions: write   # 允许删除工作流运行记录

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ secrets.MODAL_ENVIRONMENT || 'main' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install modal
          # Install all dependencies from requirements.txt
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py

      - name: Inject index.html content into app.py
        run: |
          python -c "
          import base64
          import re
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          encoded = base64.b64encode(html.encode('utf-8')).decode('utf-8')
          with open('app.py', 'r', encoding='utf-8') as f:
              content = f.read()
          # 替换占位符
          content = re.sub(
              r'INDEX_HTML_B64 = \"\"  # PLACEHOLDER_FOR_HTML_CONTENT',
              f'INDEX_HTML_B64 = \"{encoded}\"',
              content
          )
          with open('app.py', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Injected {len(encoded)} bytes of HTML into app.py')
          "

      - name: Obfuscate app.py
        run: |
          python -c "
          import zlib, base64
          with open('app.py', 'r', encoding='utf-8') as f:
              code = f.read()
          compressed = base64.b64encode(zlib.compress(code.encode('utf-8'), 9))[::-1]
          obfuscated = f\"_ = lambda __ : __import__('zlib').decompress(__import__('base64').b64decode(__[::-1]));exec((_)(b'{compressed.decode()}'))\"
          with open('app.py', 'w', encoding='utf-8') as f:
              f.write(obfuscated)
          print('Code obfuscated successfully')
          "

      - name: Deploy to Modal
        run: |
          modal deploy app.py::app

      - name: Deployment Success
        run: echo "🎉 Deployment completed successfully!"

      - name: Clean up old workflow runs
        uses: MajorScruffy/delete-old-workflow-runs@v0.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          older-than-seconds: 3600  # 删除1小时前的记录
